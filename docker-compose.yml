services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: portfolio-app
    container_name: portfolio-app
    ports:
      - "8081:8081" # Matches your laptop's 8081 to the container's 8081
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - PORT=8081 # Tells Spring Boot to use 8081 inside the container
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/portfolio
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  mongo-data:
